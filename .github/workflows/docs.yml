name: Documentation

on:
    pull_request:
        paths:
            - ".github/workflows/docs.yml"
            - "ci/New-ModuleDocs.ps1"
            - "docs/**"
            - "PSStarr/Source/**"
            - "PSStarr/build.psd1"
            - ".python-version"
            - "pyproject.toml"
            - "uv.lock"
            - "zensical.toml"
    push:
        branches:
            - main
        paths:
            - ".github/workflows/docs.yml"
            - "ci/New-ModuleDocs.ps1"
            - "docs/**"
            - ".python-version"
            - "pyproject.toml"
            - "uv.lock"
            - "zensical.toml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: documentation-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    documentation-consistency:
        name: Documentation consistency
        if: github.event_name == 'pull_request'
        runs-on: windows-latest
        defaults:
            run:
                shell: pwsh
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.2.0
              with:
                  version: "0.12.19"
                  enable-cache: true

            - name: Install module build dependencies
              run: |
                  if ($null -eq (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                      Register-PSRepository -Default
                  }

                  Set-PSRepository PSGallery -InstallationPolicy Trusted
                  Install-Module Configuration -RequiredVersion 1.6.0 -Scope CurrentUser -Force
                  Install-Module Microsoft.PowerShell.PlatyPS -RequiredVersion 1.0.3 -Scope CurrentUser -Force
                  Install-Module ModuleBuilder -RequiredVersion 3.2.18 -Scope CurrentUser -Force

            - name: Build the module and regenerate command documentation
              run: |
                  $manifest = Import-PowerShellDataFile ./PSStarr/Source/PSStarr.psd1
                  $version = [string]$manifest.ModuleVersion

                  Build-Module ./PSStarr/build.psd1

                  ./ci/New-ModuleDocs.ps1 `
                      -ModulePath "./PSStarr/Output/PSStarr/$version/PSStarr.psd1" `
                      -OutputPath ./docs/command-reference

            - name: Check generated command documentation
              run: |
                  git diff --exit-code -- docs/command-reference

                  if ($LASTEXITCODE -ne 0) {
                      throw 'Generated command documentation is not current. Run ci/New-ModuleDocs.ps1 and commit the result.'
                  }

            - name: Synchronize documentation dependencies
              run: uv sync --locked --only-group docs

            - name: Build the site in strict mode
              run: uv run --locked --only-group docs zensical build --clean --strict

    site-build:
        name: Site build
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Check out the repository
              uses: actions/checkout@v7

            - name: Configure GitHub Pages
              uses: actions/configure-pages@v6

            - name: Set up uv
              uses: astral-sh/setup-uv@v10.2.0
              with:
                  version: "0.12.19"
                  enable-cache: true

            - name: Synchronize documentation dependencies
              run: uv sync --locked --only-group docs

            - name: Build the site in strict mode
              run: uv run --locked --only-group docs zensical build --clean --strict

            - name: Upload the GitHub Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: site

    pages-deploy:
        name: Pages deploy
        if: github.event_name == 'push' || github.ref == 'refs/heads/main'
        needs: site-build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
